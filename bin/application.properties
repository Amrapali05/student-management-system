# ===================================================================
# EduCore Enterprise Student Management System Configuration
# ===================================================================

# Storage persistence type: FILE_JSON or DATABASE
app.storage.type=FILE_JSON

# File persistence directory
app.data.dir=data

# Concurrency thread pool size
app.concurrency.pool-size=8

# Scheduled background auto-save daemon settings
app.autosave.enabled=true
app.autosave.interval-seconds=60

# Database integration settings (used when app.storage.type=DATABASE)
db.url=jdbc:sqlite:data/students.db
db.username=sa
db.password=
db.driver-class=org.sqlite.JDBC
